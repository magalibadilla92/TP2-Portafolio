
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopción de mascotas</title>

    <!-- Bootstrap para el diseño y los estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #fff4f0;
        }

        .contenedor {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 12px #00000020;
        }

        h1 {
            color: #9b4d68;
            text-align: center;
        }

        .btn-adoptar {
            background-color: #9b4d68;
            color: white;
        }

        .btn-adoptar:hover {
            background-color: #78384f;
            color: white;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>🐾 ¡Adoptá un amigo!</h1>

        <p class="text-center">
            Completá el formulario para iniciar tu solicitud de adopción.
        </p>

        <!-- Formulario con validación de campos obligatorios -->
        <form id="formAdopcion">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre"
                       placeholder="Ingresá tu nombre" required>
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo"
                       placeholder="ejemplo@correo.com" required>
            </div>

            <div class="mb-3">
                <label for="mascota" class="form-label">¿Qué mascota querés adoptar?</label>
                <select class="form-select" id="mascota" required>
                    <option value="">Seleccioná una opción</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label">Contanos por qué querés adoptar</label>
                <textarea class="form-control" id="mensaje" rows="3"
                          placeholder="Escribí tu mensaje" required></textarea>
            </div>

            <button type="submit" class="btn btn-adoptar w-100">
                Enviar solicitud
            </button>

            <p id="resultado" class="mt-3 text-center"></p>
        </form>
    </div>

    <!-- JavaScript para validar y mostrar una confirmación -->
    <script>
        const formulario = document.getElementById("formAdopcion");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            if (formulario.checkValidity()) {
                resultado.textContent =
                    "¡Gracias! Tu solicitud fue completada correctamente.";
                resultado.className = "mt-3 text-center text-success";

                formulario.reset();
            } else {
                formulario.reportValidity();
            }
        });
    </script>

</body>
</html>
